spring.application.name=shiptrack-pro
logging.level.root=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/shiptrack}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET_KEY:${JWT_SECRET}}
jwt.expiration=${JWT_EXPIRATION_MS:${JWT_EXPIRATION:86400000}}

google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
google.maps.geocoding-url=${GOOGLE_MAPS_GEOCODING_URL:https://maps.googleapis.com/maps/api/geocode/json}
google.maps.directions-url=${GOOGLE_MAPS_DIRECTIONS_URL:https://maps.googleapis.com/maps/api/directions/json}

geoapify.maps.api-key=${GEOAPIFY_API_KEY:}
geoapify.maps.geocoding-api-key=${GEOAPIFY_GEOCODING_API_KEY:${GEOAPIFY_API_KEY:}}
geoapify.maps.routing-api-key=${GEOAPIFY_ROUTING_API_KEY:${GEOAPIFY_API_KEY:}}
geoapify.maps.geocoding-url=${GEOAPIFY_GEOCODING_URL:https://api.geoapify.com/v1/geocode/search}
geoapify.maps.autocomplete-url=${GEOAPIFY_AUTOCOMPLETE_URL:https://api.geoapify.com/v1/geocode/autocomplete}
geoapify.maps.routing-url=${GEOAPIFY_ROUTING_URL:https://api.geoapify.com/v1/routing}
geoapify.maps.country-code=${GEOAPIFY_COUNTRY_CODE:in}

app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

app.eta.at-risk-threshold=${ETA_AT_RISK_THRESHOLD:6.0}
app.eta.recalculation-interval-ms=${ETA_RECALCULATION_INTERVAL_MS:1200000}
app.eta.recalculation-initial-delay-ms=${ETA_RECALCULATION_INITIAL_DELAY_MS:1200000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.notifications.email-enabled=${MAIL_ENABLED:false}
app.notifications.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.notifications.duplicate-window-minutes=${NOTIFICATION_DUPLICATE_WINDOW_MINUTES:5}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB
app.storage.upload-directory=${POD_UPLOAD_DIR:uploads/pod}
app.storage.max-file-size-bytes=5242880
