jwt.secret=test-only-secret-key-that-is-at-least-sixty-four-characters-long-for-hmac-signing-123456
jwt.expiration=3600000

google.maps.api-key=
geoapify.maps.api-key=
geoapify.maps.geocoding-api-key=
geoapify.maps.routing-api-key=
geoapify.maps.country-code=in
app.websocket.allowed-origins=http://localhost:3000
app.notifications.email-enabled=false
app.notifications.duplicate-window-minutes=5
spring.mail.host=localhost
app.storage.upload-directory=target/test-uploads/pod
